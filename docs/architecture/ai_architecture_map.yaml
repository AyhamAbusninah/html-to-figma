  - {step: "R4 SVG: sanitized outerHTML → SvgNode → figma.createNodeFromSvg", touch: ["collect.ts", "convert.ts", "plan.ts", "render.ts"], blast_radius: high}
  - {step: "Gradients + background images", touch: ["convert.ts (parse)", "plan.ts mapFills", "render.ts"], blast_radius: medium}
