critical_invariants:
  fail_closed:
    - "Capture validated before it leaves the page (content/index.ts:49); consumers validate before render (ui.ts:31, preview main.ts:106)."
    - "> 10,000 nodes throws (convert.ts:142); > 200 MB refused (popup.ts:55); unsupported schema major rejected (validate.ts:106)."
    - "Packaging fails on unapproved permissions, declared content_scripts, unreferenced or unexpected files (package-extension.mjs:79-111)."
  locks_concurrency:
    - "No locks. Capture is one synchronous traversal after document.fonts.ready; plugin render is sequential with cooperative yields (render.ts:98)."
  permissions:
    - "Minimal MV3 permissions + approved host allow-list; no remote code; plugin networkAccess none."
    - "Local only: captures never leave the machine unless the user shares the file."
  idempotency:
    - "Deterministic output for a given snapshot (ids by traversal order, injected capturedAt)."
  ordering:
    - "Paint order via OrderKey (convert.ts:173); fonts loaded before text creation (render.ts:84)."
  universality:
    - "No site-specific code in engine/extension/plugin src (check-universal.mjs); Frappe/ERPNext is a benchmark only (SC-1)."
  rtl:
    - "Arabic/RTL is MVP-blocking: physical alignment resolved from start/end (text.ts:31), RTL x normalization, Arabic font rules, no letter-spacing on Arabic."
  read_only_page:
    - "Capture never modifies the page DOM (AC-EXT-8)."

known_gaps:
  - "Images (R4, in progress on feat/images-icons): inline SVG, <img src=*.svg>, same-origin/data/blob/CORS images, canvas and video are captured (content/assets.ts). Still placeholders: cross-origin images without CORS (Tier 2 fetch needs a host permission, Tier 3 screenshot crop not built), iframes, CSS background images. The Figma plugin still draws images/SVG as placeholders (Copy to Figma and the preview draw them)."
  - "Gradients not captured although the schema supports them (convert.ts:385 warns GRADIENT_NOT_CAPTURED)."
  - "::before/::after not captured (OQ-7 decided B, not implemented); text-overflow ellipsis not applied; icon fonts (OQ-16) not rasterized."
  - "Element picker (OQ-4, MVP) and inner scroll-area expansion (OQ-5) not implemented; captureMode is always 'page' (document.ts:61)."
  - "Rich text: one style per TEXT; a word split across inline elements (e.g. <mark>) doesn't join Arabic letters across layers (OQ-11 option B, v1.1)."
  - "No auto-layout inference: output is absolute-positioned frames (html.to.design offers auto layout)."
  - "Real Figma never exercised by the plugin (B-1/B-2); plugin verified only against the mock."
  - "Copy to Figma (SVG, 0.3.0) gives groups + vectors + editable text, not real frames or auto layout; wrapped paragraphs become groups of line layers; justified text is start-aligned. Native frames by paste need Figma's capture.js/h2d (permission, CB-2) or fig-kiwi (legal review, CB-3)."
  - "Form-control text (controlText) uses the content box as its rect, so single-line input text sits up to ~4 px high in Figma (plugin and SVG)."
  - "LIMITS.maxNodes/maxImageSide/maxSvgBytes/maxPseudoElements defined but unused (extension/src/config/constants.ts)."
  - "Doc drift: README 'Status (2026-11-08)' predates 0.2.1, the preview and the clipboard spike."

