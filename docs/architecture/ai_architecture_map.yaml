    - "New warning code: add it to WARNING_CODES (packages/schema/src/warnings.ts:5); emit with warn(ctx, CODE, ...) (core/src/convert.ts:113); aggregated codes also need AGGREGATED + AGGREGATED_MESSAGE (convert.ts:46-66)."
    - "Copy to Figma output change: edit packages/figma-plugin/src/svg/svg.ts + its tests; re-verify by a real paste in Figma Web (rules can only be measured there)."
    - "Extension version bump: packages/extension/package.json, public/manifest.json, src/config/version.ts, e2e/extension.spec.ts VERSION, INSTALL.md. package-extension.mjs:76 fails if manifest ≠ package.json."
    - "New extension permission: also add it to ALLOWED_PERMISSIONS (scripts/package-extension.mjs:35), REQUIREMENTS EXT-P-3a, INSTALL.md permission table; packaging fails otherwise."
    - "New exported core helper: re-export from packages/core/src/index.ts (the extension imports only '@h2f/core')."
