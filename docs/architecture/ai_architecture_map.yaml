  goal: >-
    An html.to.design-style tool: capture the design of any website (public or behind a login, LTR or Arabic/RTL)
    and recreate it in Figma as native, editable layers (frames, text, images, SVG) that designers can edit.
  stacks: ["TypeScript 6 strict (erasableSyntaxOnly), Node 22 native TS", "pnpm 10 workspace (packages/*)", "Chrome MV3 extension", "Figma plugin (Plugin API 1.0.0)", "Vite 8, Vitest 4, Playwright 1.64, Ajv standalone, TypeBox"]
