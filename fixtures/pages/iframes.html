<!doctype html>
<!--
  Fixture: iframes
  Purpose: iframe handling — same-origin srcdoc and src iframes (traversed), a cross-origin
           iframe (placeholder), iframe border + padding offsets, a scrolled same-origin iframe.
  Requirements: EXT-T-7, EXT-G-1, EXT-V-8, EXT-C-2
  Expected capture behaviour (data-testid):
    - frame-srcdoc: contentDocument traversed; its nodes appear inside a clipping FRAME at the
      iframe's content-box position = iframe rect + border (2px) + padding (0) (EXT-T-7). The
      heading "Inside srcdoc", the gradient card and the button are captured as real nodes.
    - frame-same-origin: src="boxes.html" (same origin) — traversed; only the part inside the
      600×320 viewport is visible (clipsContent true).
    - frame-padded: border 8px + padding 16px → inner document offset by (24, 24) from the iframe
      border-box origin. Text "Padded frame" must sit at iframe.x + 24 + body margin.
    - frame-scrolled: same-origin iframe whose inner document is scrolled to y = 200 by script
      → captured at the current scroll offset (row "Item 06" near the top).
    - frame-cross-origin: src from http://127.0.0.1:4174 → FRAME placeholder with light-grey
      fill at the iframe rect + warning IFRAME_CROSS_ORIGIN; none of its content is captured.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: iframes</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: block; src: url(../assets/vendor/fonts/inter/Inter-400.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: block; src: url(../assets/vendor/fonts/inter/Inter-600.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 13px/1.4 "Inter", sans-serif; color: #111827; background: #fff; width: 1100px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 14px; margin: 28px 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #4b5563; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .cap { margin-top: 6px; color: #4b5563; font-size: 12px; }
  iframe { display: block; background: #fff; }
  .f-srcdoc { width: 420px; height: 220px; border: 2px solid #6366f1; border-radius: 0; }
  .f-same { width: 600px; height: 320px; border: 1px solid #94a3b8; }
  .f-padded { width: 360px; height: 200px; border: 8px solid #f59e0b; padding: 16px; background: #fffbeb; }
  .f-scrolled { width: 300px; height: 200px; border: 1px solid #94a3b8; }
  .f-cross { width: 420px; height: 260px; border: 2px dashed #dc2626; }
</style>
</head>
<body>
<h1>Iframes</h1>

<h2>Same origin</h2>
<div class="row">
  <div data-testid="frame-srcdoc">
    <iframe class="f-srcdoc" title="srcdoc frame" srcdoc='<!doctype html><html><head><style>
      body{margin:16px;font:14px/1.4 sans-serif;color:#1e1b4b;background:#eef2ff}
      h3{margin:0 0 10px;font-size:18px}
      .card{height:70px;border-radius:10px;background:linear-gradient(90deg,#818cf8,#c084fc);margin-bottom:12px}
      button{font:600 13px sans-serif;padding:8px 14px;border-radius:6px;border:0;background:#4338ca;color:#fff}
    </style></head><body><h3>Inside srcdoc</h3><div class="card"></div><button>Button in iframe</button></body></html>'></iframe>
    <div class="cap">srcdoc, 2px border</div>
  </div>
  <div data-testid="frame-padded">
    <iframe class="f-padded" title="padded frame" srcdoc='<!doctype html><html><head><style>body{margin:8px;font:600 15px sans-serif;color:#78350f;background:#fef3c7}</style></head><body>Padded frame<div style="margin-top:10px;height:60px;background:#f59e0b;border-radius:8px"></div></body></html>'></iframe>
    <div class="cap">8px border + 16px padding</div>
  </div>
</div>
<div class="row" style="margin-top:24px">
  <div data-testid="frame-same-origin">
    <iframe class="f-same" title="boxes fixture" src="boxes.html"></iframe>
    <div class="cap">src="boxes.html" (same origin)</div>
  </div>
  <div data-testid="frame-scrolled">
    <iframe class="f-scrolled" id="scrolled-frame" title="scrolled frame" srcdoc='<!doctype html><html><head><style>body{margin:0;font:14px sans-serif}div{box-sizing:border-box;height:40px;padding:10px 12px;border-bottom:1px solid #e2e8f0}div:nth-child(odd){background:#f8fafc}</style></head><body><div>Item 01</div><div>Item 02</div><div>Item 03</div><div>Item 04</div><div>Item 05</div><div>Item 06</div><div>Item 07</div><div>Item 08</div><div>Item 09</div><div>Item 10</div><div>Item 11</div><div>Item 12</div></body></html>'></iframe>
    <div class="cap">inner document scrolled to y=200</div>
  </div>
</div>

<h2>Cross origin</h2>
<div data-testid="frame-cross-origin">
  <iframe class="f-cross" title="cross-origin frame" src="http://127.0.0.1:4174/pages/forms.html"></iframe>
  <div class="cap">src from http://127.0.0.1:4174 → placeholder + IFRAME_CROSS_ORIGIN</div>
</div>

<script>
  const sf = document.getElementById("scrolled-frame");
  const scrollInner = () => sf.contentWindow.scrollTo(0, 200);
  if (sf.contentDocument && sf.contentDocument.readyState === "complete" && sf.contentDocument.body?.children.length) scrollInner();
  sf.addEventListener("load", scrollInner);
</script>
</body>
</html>
