<!doctype html>
<!--
  Fixture: images-same-origin
  Purpose: same-origin raster sources through Tier 1 (canvas) — srcset / <picture> candidate
           selection, object-fit modes, rounded images, data: and blob: URLs, lazy loading,
           <canvas>, <video> poster and current frame, non-PNG formats that need re-encoding.
  Requirements: EXT-I-1, EXT-I-2, EXT-I-5, EXT-I-6, EXT-I-7, EXT-I-9, EXT-I-10, EXT-C-1, EXT-C-2,
                EXT-S-5, PLG-R-7, AC-PLG-9
  Expected capture behaviour (data-testid):
    - srcset-w / srcset-x: the asset is the candidate Chrome rendered (currentSrc). At DPR 1 the
      image shows the label "400W 1X"; at DPR 2 it shows "1600W 2X". The capture must match the
      label visible on screen.
    - picture-webp: currentSrc is the .webp (label "800X500 WEBP") → re-encoded to JPEG/PNG (EXT-I-6).
    - fit-cover → scaleMode FILL; fit-contain and fit-scale-down → FIT; fit-fill → STRETCH;
      fit-none → FIT + warning (EXT-I-10). fit-position: object-position right bottom (corner
      marker lime/BR visible).
    - rounded: IMAGE node with per-corner radii 24px; circle: radius 60 (50% of 120).
    - data-png / data-svg: Tier 1 succeeds (source "canvas"); data-svg may become an SvgNode.
    - blob: blob: URL created by script — Tier 1. Note: the blob URL string changes on every load,
      so goldens must not compare the URL.
    - fmt-jpg → JPEG; fmt-gif (animated, 3 frames) → first frame as PNG (EXT-I-6); fmt-ico and
      fmt-alpha-webp → PNG (alpha preserved); fmt-svg (<img src=*.svg>) → SvgNode (EXT-S-5).
    - dedupe: photo-800x500.png is used 4 times on this page → exactly one asset entry (EXT-I-9).
    - broken: 404 image → assetId null + IMAGE_FETCH_FAILED (EXT-I-5); plugin draws placeholder.
    - lazy-far: ~3000px below the fold, loading="lazy" — present only when auto-scroll is on
      (EXT-C-1); otherwise it may be captured as not-yet-loaded / placeholder.
    - canvas-drawn: IMAGE node of the canvas bitmap (quadrants, circle, text "CANVAS 42").
    - video-poster: preload="none" → poster image ("POSTER" label). video-frame: script seeks to
      1.5 s → current frame shows "2" / "FRAME 2".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: images (same origin)</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: block; src: url(../assets/vendor/fonts/inter/Inter-400.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: block; src: url(../assets/vendor/fonts/inter/Inter-600.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 13px/1.4 "Inter", sans-serif; color: #111827; background: #fff; width: 1100px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 14px; margin: 28px 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #4b5563; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; font-size: 12px; color: #4b5563; }
  img, canvas, video { display: block; }
  .fit { width: 200px; height: 200px; background: #e5e7eb; border: 1px solid #9ca3af; }
  .fit-cover { object-fit: cover; }
  .fit-contain { object-fit: contain; }
  .fit-fill { object-fit: fill; }
  .fit-none { object-fit: none; }
  .fit-scale-down { object-fit: scale-down; }
  .fit-position { object-fit: cover; object-position: right bottom; }
  .rounded { border-radius: 24px; }
  .circle { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 0 0 2px #4f46e5; }
  .checker { background: conic-gradient(#e5e7eb 25%, #fff 0 50%, #e5e7eb 0 75%, #fff 0) 0 0 / 20px 20px; padding: 10px; }
  .spacer { height: 3000px; border-left: 4px dotted #d1d5db; margin: 20px 0 20px 40px; padding-left: 16px; color: #6b7280; }
</style>
</head>
<body>
<h1>Images — same origin</h1>
<p>All images load from this origin, <code>data:</code> or <code>blob:</code> URLs.</p>

<h2>Responsive candidates</h2>
<div class="row">
  <figure data-testid="srcset-w">
    <img src="../assets/img/photo-400x250.png"
         srcset="../assets/img/photo-400x250.png 400w, ../assets/img/photo-1600x1000.png 1600w"
         sizes="400px" width="400" height="250" alt="srcset with width descriptors">
    <figcaption>srcset 400w / 1600w, sizes=400px</figcaption>
  </figure>
  <figure data-testid="srcset-x">
    <img src="../assets/img/photo-400x250.png"
         srcset="../assets/img/photo-400x250.png 1x, ../assets/img/photo-1600x1000.png 2x"
         width="240" height="150" alt="srcset with density descriptors">
    <figcaption>srcset 1x / 2x at 240×150</figcaption>
  </figure>
  <figure data-testid="picture-webp">
    <picture>
      <source type="image/webp" srcset="../assets/img/photo-800x500.webp">
      <img src="../assets/img/photo-800x500.png" width="320" height="200" alt="picture with webp source">
    </picture>
    <figcaption>&lt;picture&gt; webp source, png fallback</figcaption>
  </figure>
</div>

<h2>object-fit (portrait 400×600 into 200×200)</h2>
<div class="row">

  <figure data-testid="fit-fill"><img class="fit fit-fill" src="../assets/img/portrait-400x600.png" alt="fill"><figcaption>fill → STRETCH</figcaption></figure>
  <figure data-testid="fit-none"><img class="fit fit-none" src="../assets/img/portrait-400x600.png" alt="none"><figcaption>none → FIT + warning</figcaption></figure>
  <figure data-testid="fit-scale-down"><img class="fit fit-scale-down" src="../assets/img/portrait-400x600.png" alt="scale-down"><figcaption>scale-down → FIT</figcaption></figure>
  <figure data-testid="fit-position"><img class="fit fit-position" src="../assets/img/photo-800x500.png" alt="cover right bottom"><figcaption>cover + object-position right bottom</figcaption></figure>
</div>

<h2>Formats</h2>

  <figure data-testid="fmt-jpg"><img src="../assets/img/photo-800x500.jpg" width="200" height="125" alt="jpeg"><figcaption>JPEG</figcaption></figure>
  <figure data-testid="fmt-gif"><img src="../assets/img/anim-120.gif" width="120" height="120" alt="animated gif"><figcaption>animated GIF</figcaption></figure>
  <figure data-testid="fmt-alpha-png"><div class="checker"><img src="../assets/img/alpha-256.png" width="128" height="128" alt="alpha png"></div><figcaption>PNG with alpha</figcaption></figure>

</div>

<h2>Canvas &amp; video</h2>
<div class="row">
  <figure data-testid="canvas-drawn"><canvas id="cv" width="240" height="150"></canvas><figcaption>&lt;canvas&gt; drawn by script</figcaption></figure>
  <figure data-testid="video-poster"><video width="320" height="180" poster="../assets/img/poster-320x180.png" preload="none" muted src="../assets/img/clip-320x180.webm"></video><figcaption>video, preload=none → poster</figcaption></figure>
  <figure data-testid="video-frame"><video id="vframe" width="320" height="180" preload="auto" muted src="../assets/img/clip-320x180.webm"></video><figcaption>video seeked to 1.5 s → frame 2</figcaption></figure>
</div>

<div class="spacer">Spacer: the lazy image below is ~3000px under the fold.</div>
<figure data-testid="lazy-far">
  <img src="../assets/img/photo-800x500.png" loading="lazy" width="400" height="250" alt="lazy image far below the fold">
  <figcaption>loading="lazy" — needs auto-scroll</figcaption>
</figure>

<script>
  // blob: URL from a same-origin fetch.
  fetch("../assets/img/alpha-256.png")
    .then((r) => r.blob())
    .then((b) => { document.getElementById("blob-img").src = URL.createObjectURL(b); });

  // Deterministic canvas drawing.
  const ctx = document.getElementById("cv").getContext("2d");
  const q = [["#ef4444", 0, 0], ["#22c55e", 120, 0], ["#3b82f6", 0, 75], ["#eab308", 120, 75]];
  for (const [c, x, y] of q) { ctx.fillStyle = c; ctx.fillRect(x, y, 120, 75); }
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.beginPath(); ctx.arc(120, 75, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#111827";
  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("CANVAS 42", 120, 75);

  // Seek the second video to frame 2 (t = 1.5 s).
  const v = document.getElementById("vframe");
  const seek = () => { v.currentTime = 1.5; };
  if (v.readyState >= 1) seek(); else v.addEventListener("loadedmetadata", seek, { once: true });
</script>
</body>
</html>
