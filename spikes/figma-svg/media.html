<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H2F spike: Figma paste boards</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 1000px; color: #111; }
  .row { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .row h2 { font-size: 16px; margin: 0 0 6px; }
  .meta { color: #555; font-size: 12px; }
  button { margin: 6px 6px 0 0; padding: 6px 10px; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; }
  .status { margin-top: 6px; font-weight: 600; }
  .ok { color: #15803d; } .err { color: #b91c1c; }
  img.thumb { display: block; margin-top: 8px; max-width: 100%; max-height: 260px; border: 1px solid #eee; }
</style>
</head>
<body>
<h1 id="title">H2F spike: paste boards for Figma</h1>
<p>For each row: click <b>Copy</b>, go to Figma, click an empty spot, press <b>Esc</b>, then <b>Ctrl+V</b>.
Boards: <a href="?board=media">media</a> (Phase 1: images, icons, gradients, size) ·
<a href="?board=editing">editing</a> (Phase 2: paragraphs and layer names) ·
<a href="?board=forms">forms</a> (Phase 2: text inside form fields, "…" truncation).</p>
<div id="rows">Loading…</div>
<script type="module">
  const board = new URLSearchParams(location.search).get('board') ?? 'media';
  const cases = await (await fetch(`out/${board}.json`)).json();
  const rows = document.getElementById('rows');
  rows.textContent = '';
  for (const c of cases) {
    const div = document.createElement('div');
    div.className = 'row';
    const mb = (new Blob([c.svg]).size / 1024 / 1024).toFixed(2);
    div.innerHTML = `<h2>${c.label}</h2><div class="meta">${mb} MB of SVG</div><button>Copy</button><div class="status"></div>`;
    if (c.id.endsWith('-board')) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = URL.createObjectURL(new Blob([c.svg], { type: 'image/svg+xml' }));
      div.appendChild(img);
    }
    const status = div.querySelector('.status');
    div.querySelector('button').addEventListener('click', () => {
      const onCopy = (e) => { e.preventDefault(); e.clipboardData.setData('text/plain', c.svg); };
      document.addEventListener('copy', onCopy, { once: true });
      const ok = document.execCommand('copy');
      status.className = `status ${ok ? 'ok' : 'err'}`;
      status.textContent = ok ? `Copied ${mb} MB. Paste in Figma (Esc, then Ctrl+V).` : 'Copy failed.';
    });
    rows.appendChild(div);
  }
</script>
</body>
</html>
