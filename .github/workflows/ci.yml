# Fedora-equivalent verification on Linux runners (plan §6: tiers T0–T5).
# Real-Figma verification (R5) cannot run in CI: Figma's plugin runtime needs the macOS/Windows desktop app
# with an interactive login.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must match)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Fetch fixture fonts/icons (OFL/MIT, not committed)
        run: node fixtures/scripts/fetch-assets.mjs

      - name: T0 static · T1 unit · T5 Figma-mock · T2/T4 browser integration
        run: pnpm run verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
